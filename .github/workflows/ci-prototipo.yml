name: CI prototipo web

on:
  push:
    paths: ["prototipo-web/**", ".github/workflows/ci-prototipo.yml"]
  pull_request:
    paths: ["prototipo-web/**"]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototipo-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototipo-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
